[project]
name = "sambatui"
version = "0.8.0"
description = "Textual TUI for Samba AD DNS and LDAP administration"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{ name = "Karl Hans Laurits", email = "karl@laurits.dev" }]
dependencies = [
  "cryptography==50.0.2",
  "dnspython==2.9.1",
  "gssapi==1.12.0",
  "ldap3==2.9.1",
  "textual==8.2.8",
]

[project.urls]
Homepage = "https://github.com/lauritsk/sambatui"
Issues = "https://github.com/lauritsk/sambatui/issues"

[project.scripts]
sambatui = "sambatui.app:main"

[dependency-groups]
dev = [
  "hypothesis==6.170.14",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.17.4",
  "ty==0.0.99",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ty.src]
include = [
  "src/sambatui",
  "tests/sambatui/core/test_mutations.py",
  "tests/sambatui/test_hardening_behaviors.py",
  "tests/sambatui/test_operation_lifecycle.py",
  "tests/sambatui/test_target_safety.py",
  "tests/sambatui/ldap/test_connection_contracts.py",
  "tests/sambatui/samba/test_execution.py",
]

[tool.pytest.ini_options]
markers = [
  "local_process: exercises real local subprocesses without network access",
  "samba: isolated, disposable Samba AD integration test (no external network)",
]

[tool.coverage.run]
omit = [
  "*/sambatui/__main__.py",
  "*/sambatui/app.py",
  "*/sambatui/app_constants.py",
  "*/sambatui/app_layout.py",
  "*/sambatui/ui/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
