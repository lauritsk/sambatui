[project]
name = "sambatui"
version = "0.7.0"
description = "Textual TUI for Samba AD DNS and LDAP administration"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Karl Hans Laurits", email = "karl@laurits.dev" }]
dependencies = [
  "dnspython==2.8.0",
  "ldap3==2.9.1",
  "textual==8.2.5",
]

[project.urls]
Homepage = "https://github.com/lauritsk/sambatui"
Issues = "https://github.com/lauritsk/sambatui/issues"

[project.scripts]
sambatui = "sambatui.app:main"

[project.optional-dependencies]
kerberos = [
  "gssapi==1.11.1 ; sys_platform != 'win32'",
  "winkerberos==0.13.0 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "hypothesis==6.152.4",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
]

[build-system]
requires = ["uv_build==0.11.12"]
build-backend = "uv_build"

[tool.coverage.run]
omit = [
  "src/sambatui/__main__.py",
  "src/sambatui/app.py",
  "src/sambatui/app_constants.py",
  "src/sambatui/app_layout.py",
  "src/sambatui/app_navigation.py",
  "src/sambatui/screens.py",
  "src/sambatui/ui/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.uv]
exclude-newer = "1 week"
