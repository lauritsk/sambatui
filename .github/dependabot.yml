version: 2
updates:
    - package-ecosystem: gomod
      directory: /
      open-pull-requests-limit: 5
      schedule:
          interval: weekly
          day: monday
          time: "08:00"
          timezone: UTC
      groups:
          go:
              patterns: ["*"]
    - package-ecosystem: docker
      directory: /integration
      open-pull-requests-limit: 5
      schedule:
          interval: weekly
          day: monday
          time: "08:00"
          timezone: UTC
    - package-ecosystem: github-actions
      directory: /
      open-pull-requests-limit: 5
      schedule:
          interval: weekly
          day: monday
          time: "08:00"
          timezone: UTC
      groups:
          actions:
              patterns: ["*"]
