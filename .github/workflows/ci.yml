name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Authenticate to Docker Hardened Images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login dhi.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - name: Check Dockerfile
        run: docker build --check .
      - name: Build production image
        run: docker compose build app
      - name: Check production dependencies
        run: |
          docker compose run --rm -T --entrypoint python app - <<'PY'
          import subprocess
          import gssapi
          import sambatui.app
          for command in (["samba-tool", "dns", "--help"], ["klist", "-V"], ["dig", "-v"]):
              subprocess.run(command, check=True, stdout=subprocess.DEVNULL)
          PY
      - name: Run containerized tests
        run: docker compose --profile test run --build --rm -T test
