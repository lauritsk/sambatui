name: Native Go

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            disposable_samba:
                description: Run isolated Samba interoperability and terminal tests
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: native-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
    run:
        shell: bash

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: "1.27.3"
                  cache: true
            - run: go install mvdan.cc/gofumpt@v0.12.0
              timeout-minutes: 5
            - name: Formatting, vet, native and race tests, build
              run: go run ./cmd/dev check

    disposable-samba:
        if: github.event_name == 'workflow_dispatch' && inputs.disposable_samba
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: "1.27.3"
                  cache: true
            - run: go run ./cmd/dev integration

    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: "1.27.3"
                  cache: true
            - name: Build complete release set and checksums before publication
              env:
                  VERSION: ${{ github.ref_name }}
              run: go run ./cmd/dev release --version "$VERSION" --output dist
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: native-release
                  path: dist/*
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: false
                  compression-level: 0
                  include-hidden-files: false
            - uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
              with:
                  files: dist/*
                  fail_on_unmatched_files: true
                  generate_release_notes: true
